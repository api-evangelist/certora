name: Certora
description: >-
  Certora is a smart-contract security company whose core product is the Certora
  Prover, a state-of-the-art automated formal-verification engine that checks
  every possible contract state and execution path to find critical
  vulnerabilities in smart contracts running on EVM-based chains, Solana,
  Stellar (Soroban), and Sui. Developers write rules in the Certora Verification
  Language (CVL) and submit verification jobs to Certora's cloud from the
  command line using the open-source certora-cli (certoraRun) tool, which
  authenticates with a personal access key. Alongside the Prover, Certora offers
  the Gambit mutation-testing tool, expert manual audits, and verification
  contests, and reports protecting over $100B in total value locked across major
  DeFi protocols. This profile was surfaced as an Electric Capital portfolio
  company and enriched by the API Evangelist pipeline.
